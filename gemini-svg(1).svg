<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="100%" height="100%" style="background-color: #000000;">
  <style>
    .amount {
      font-family: 'Courier New', Courier, monospace, sans-serif;
      font-size: 32px;
      font-weight: bold;
      fill: #ffffff;
      text-anchor: middle;
    }
    .fiat {
      font-family: 'Courier New', Courier, monospace, sans-serif;
      font-size: 16px;
      fill: #cccccc;
      text-anchor: middle;
    }
    .btn-text {
      font-family: 'Courier New', Courier, monospace, sans-serif;
      font-size: 16px;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .rate {
      font-family: 'Courier New', Courier, monospace, sans-serif;
      font-size: 11px;
      fill: #888888;
      text-anchor: middle;
    }
  </style>

  <!-- Main Balance Display -->
  <text x="200" y="260" class="amount">1,234,567 sats</text>
  
  <!-- Fiat Value -->
  <text x="200" y="300" class="fiat">€6,019  •  $6,492</text>

  <!-- Receive Button -->
  <g transform="translate(45, 360)">
    <rect x="0" y="0" width="125" height="46" rx="10" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="62.5" y="24" class="btn-text">Receive</text>
  </g>

  <!-- Swap Arrows Icon (Up and Down) -->
  <g transform="translate(186, 368)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Up Arrow -->
    <line x1="8" y1="28" x2="8" y2="4" />
    <polyline points="3,9 8,4 13,9" />
    
    <!-- Down Arrow -->
    <line x1="20" y1="4" x2="20" y2="28" />
    <polyline points="15,23 20,28 25,23" />
  </g>

  <!-- Send Button -->
  <g transform="translate(230, 360)">
    <rect x="0" y="0" width="125" height="46" rx="10" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="62.5" y="24" class="btn-text">Send</text>
  </g>

  <!-- Bottom Exchange Rate Info -->
  <text x="200" y="650" class="rate">1 BTC = $77,092  •  €1 = $1.1699</text>
</svg>
