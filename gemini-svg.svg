<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #000000;">
  <style>
    text { font-family: 'Courier New', Courier, monospace; fill: #ffffff; }
    .label { font-size: 11px; fill: #555555; }
    .amount { font-size: 32px; font-weight: bold; }
    .fiat { font-size: 16px; fill: #888888; }
    .rate { font-size: 11px; fill: #666666; }
  </style>

  <defs>
    <clipPath id="slider-clip">
      <rect x="0" y="0" width="340" height="52" rx="10" ry="10" />
    </clipPath>
  </defs>

  <!-- ================= 01. LOGO ================= -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" class="label">01. LOGO</text>
    <g transform="translate(0, 20)">
      <g stroke="#ffffff" stroke-width="2.2" fill="none" transform="rotate(-12, 12, 15)">
        <path d="M 6 3 V 27 M 10 3 V 27 M 6 6 H 17 C 20.5 6, 22.5 8, 22.5 11 C 22.5 14, 20.5 15.5, 17 15.5 H 6 M 6 15.5 H 18 C 22 15.5, 24 17.5, 24 21 C 24 24.5, 22 26.5, 18 26.5 H 6" />
      </g>
      <text x="32" y="22" font-size="28" font-weight="bold">asic</text>
    </g>
  </g>

  <!-- ================= 02. BALANCE DISPLAY ================= -->
  <g transform="translate(450, 40)">
    <text x="0" y="0" class="label">02. BALANCE HEADER</text>
    <g transform="translate(0, 30)">
      <text x="0" y="0" class="amount">1,234,567 sats</text>
      <text x="0" y="30" class="fiat">€6,019 • $6,492</text>
    </g>
  </g>

  <!-- ================= 03. NAVIGATION & BUTTONS ================= -->
  <g transform="translate(50, 160)">
    <text x="0" y="0" class="label">03. NAVIGATION BUTTONS</text>
    
    <!-- Receive Button -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="120" height="44" rx="8" ry="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="60" y="27" font-size="15" text-anchor="middle">Receive</text>
    </g>

    <!-- Swap Arrows -->
    <g transform="translate(138, 30)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="6" y1="24" x2="6" y2="4" /><polyline points="2,8 6,4 10,8" />
      <line x1="18" y1="4" x2="18" y2="24" /><polyline points="14,20 18,24 22,20" />
    </g>

    <!-- Send Button -->
    <g transform="translate(180, 20)">
      <rect x="0" y="0" width="120" height="44" rx="8" ry="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="60" y="27" font-size="15" text-anchor="middle">Send</text>
    </g>
  </g>

  <!-- ================= 04. INPUT FIELDS ================= -->
  <g transform="translate(450, 160)">
    <text x="0" y="0" class="label">04. INPUT FIELDS</text>

    <!-- Address Input -->
    <g transform="translate(0, 25)">
      <text x="0" y="0" font-size="14">To (Bitcoin address)</text>
      <text x="0" y="28" font-size="14" fill="#444444">Paste or Scan QR</text>
      <line x1="0" y1="42" x2="350" y2="42" stroke="#222222" stroke-width="1"/>

      <!-- Paste Icon -->
      <g transform="translate(285, 12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="12" height="14" rx="2" />
        <path d="M 7 5 V 3 A 1 1 0 0 1 8 2 H 10 A 1 1 0 0 1 11 3 V 5" />
      </g>
      <!-- QR Icon -->
      <g transform="translate(320, 12)" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="6" height="6" /><rect x="12" y="2" width="6" height="6" /><rect x="2" y="12" width="6" height="6" />
        <path d="M 12 12 h 2 v 2 h -2 z M 16 12 h 2 v 6 h -2 z M 12 16 h 4 v 2 h -4 z" fill="#ffffff" stroke="none"/>
      </g>
    </g>
  </g>

  <!-- ================= 05. SLIDER STATES (3 TRANSITIONS) ================= -->
  <g transform="translate(50, 290)">
    <text x="0" y="0" class="label">05. SLIDE TO CONFIRM STATES</text>

    <!-- State 1: Idle -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="340" height="52" rx="10" ry="10" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
      <text x="180" y="31" font-size="14" text-anchor="middle">Slide to confirm</text>
      <rect x="4" y="4" width="44" height="44" rx="8" ry="8" fill="#ffffff" />
      <polyline points="22,20 28,26 22,32" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- State 2: Sliding -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="340" height="52" rx="10" ry="10" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
      <g clip-path="url(#slider-clip)">
        <rect x="0" y="0" width="180" height="52" fill="#ffffff" />
        <text x="180" y="31" font-size="14" text-anchor="middle" fill="#000000">Slide to confirm</text>
      </g>
      <rect x="140" y="4" width="44" height="44" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <polyline points="158,20 164,26 158,32" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- State 3: Confirmed -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="340" height="52" rx="10" ry="10" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
      <text x="160" y="31" font-size="14" text-anchor="middle" fill="#000000">Slide to confirm</text>
      <rect x="292" y="4" width="44" height="44" rx="8" ry="8" fill="#000000" />
      <polyline points="310,20 316,26 310,32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- ================= 06. UTILITY ASSETS & QR ================= -->
  <g transform="translate(450, 290)">
    <text x="0" y="0" class="label">06. UTILITIES &amp; QR</text>

    <!-- Standalone Icons -->
    <g transform="translate(0, 25)">
      <!-- Copy -->
      <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none">
        <rect x="2" y="4" width="12" height="13" rx="2"/>
        <path d="M 6 4 V 2 H 16 V 12 H 14"/>
      </g>
      <!-- Share -->
      <g transform="translate(40, 0)" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none">
        <path d="M 3 11 v 5 h 14 v -5"/><polyline points="14,5 10,1 6,5"/><line x1="10" y1="1" x2="10" y2="12"/>
      </g>
    </g>

    <!-- Clean QR Frame -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="140" height="140" rx="14" ry="14" fill="#111111" stroke="#222222" stroke-width="1"/>
      <g transform="translate(18, 18)" fill="#ffffff">
        <rect x="0" y="0" width="30" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="4"/>
        <rect x="7" y="7" width="16" height="16" rx="1"/>

        <rect x="74" y="0" width="30" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="4"/>
        <rect x="81" y="7" width="16" height="16" rx="1"/>

        <rect x="0" y="74" width="30" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="4"/>
        <rect x="7" y="81" width="16" height="16" rx="1"/>

        <!-- Matrix elements -->
        <rect x="40" y="5" width="8" height="8"/>
        <rect x="52" y="15" width="12" height="8"/>
        <rect x="40" y="35" width="18" height="18"/>
        <rect x="65" y="40" width="10" height="25"/>
        <rect x="85" y="70" width="12" height="12"/>
        <rect x="40" y="80" width="22" height="8"/>
      </g>
    </g>
  </g>

  <!-- ================= 07. FOOTER ================= -->
  <g transform="translate(50, 580)">
    <text x="0" y="0" class="label">07. EXCHANGE RATE FOOTER</text>
    <text x="0" y="25" class="rate">1 BTC = $77,092 • €1 = $1.1699</text>
  </g>

</svg>
